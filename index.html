<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>山田式ACEメソッド｜ナレッジマップ</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400;500;700;900&family=Josefin+Sans:wght@300;400;600;700&display=swap');

  :root {
    --bg-deep: #06080e;
    --bg-mid: #0b0f1a;
    --panel-bg: rgba(8, 12, 22, 0.94);
    --border: rgba(90, 200, 170, 0.15);
    --border-hover: rgba(90, 200, 170, 0.4);
    --accent: #5ac8aa;
    --accent-dim: rgba(90, 200, 170, 0.6);
    --accent-glow: rgba(90, 200, 170, 0.12);
    --text: #c8d0d8;
    --text-dim: rgba(200, 208, 216, 0.4);
    --text-bright: #e8eff4;
    --danger: #e85a6a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg-deep);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    color: var(--text);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  canvas#main {
    position: fixed;
    top: 0; left: 0;
    z-index: 0;
  }

  .header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 28px;
    background: linear-gradient(180deg, rgba(6,8,14,0.95) 0%, rgba(6,8,14,0) 100%);
    pointer-events: none;
  }

  .header > * { pointer-events: auto; }

  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .brand-icon {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, var(--accent), rgba(90,200,170,0.15));
    animation: pulse-brand 4s ease-in-out infinite;
  }

  @keyframes pulse-brand {
    0%, 100% { box-shadow: 0 0 12px rgba(90,200,170,0.2); }
    50% { box-shadow: 0 0 24px rgba(90,200,170,0.4); }
  }

  .brand h1 {
    font-family: 'Josefin Sans', sans-serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 3px;
    color: var(--accent);
    text-transform: uppercase;
  }

  .brand .sub {
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 1.5px;
    margin-top: 2px;
  }

  .header-actions {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .btn {
    background: var(--accent-glow);
    border: 1px solid var(--border);
    color: var(--accent-dim);
    padding: 7px 16px;
    font-family: 'Josefin Sans', sans-serif;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 3px;
    transition: all 0.25s;
    white-space: nowrap;
  }

  .btn:hover {
    background: rgba(90, 200, 170, 0.18);
    border-color: var(--border-hover);
    color: var(--accent);
  }

  .btn-danger {
    border-color: rgba(232, 90, 106, 0.2);
    color: rgba(232, 90, 106, 0.5);
    background: rgba(232, 90, 106, 0.05);
  }

  .btn-danger:hover {
    border-color: rgba(232, 90, 106, 0.5);
    color: var(--danger);
    background: rgba(232, 90, 106, 0.12);
  }

  .stats {
    position: fixed;
    bottom: 20px; left: 28px;
    z-index: 50;
    display: flex;
    gap: 24px;
  }

  .stat-item {
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 1px;
  }

  .stat-item span {
    color: var(--accent-dim);
    font-family: 'Josefin Sans', sans-serif;
    font-weight: 600;
    font-size: 13px;
    margin-left: 4px;
  }

  .legend {
    position: fixed;
    bottom: 20px; right: 28px;
    z-index: 50;
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: color 0.2s;
  }

  .legend-item:hover { color: var(--text); }

  .legend-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
  }

  .tooltip {
    position: fixed;
    z-index: 200;
    background: var(--panel-bg);
    border: 1px solid var(--border);
    padding: 14px 20px;
    border-radius: 6px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    max-width: 280px;
    backdrop-filter: blur(16px);
  }

  .tooltip.visible { opacity: 1; }

  .tooltip .t-name {
    font-family: 'Josefin Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1.5px;
    margin-bottom: 4px;
  }

  .tooltip .t-cat {
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .tooltip .t-memo {
    font-size: 11px;
    color: var(--text);
    line-height: 1.6;
    margin-bottom: 6px;
    max-height: 80px;
    overflow: hidden;
  }

  .tooltip .t-link {
    font-size: 10px;
    color: var(--accent-dim);
    word-break: break-all;
  }

  .tooltip .t-conn {
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 6px;
  }

  .side-panel {
    position: fixed;
    top: 0; right: -420px;
    width: 400px;
    height: 100vh;
    z-index: 300;
    background: var(--panel-bg);
    border-left: 1px solid var(--border);
    backdrop-filter: blur(24px);
    padding: 28px;
    overflow-y: auto;
    transition: right 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .side-panel.open { right: 0; }

  .side-panel h2 {
    font-family: 'Josefin Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 3px;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .close-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 20px;
    cursor: pointer;
    padding: 4px;
    line-height: 1;
    transition: color 0.2s;
  }

  .close-btn:hover { color: var(--text); }

  .field { margin-bottom: 18px; }

  .field label {
    display: block;
    font-size: 10px;
    letter-spacing: 1.5px;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .field input, .field select, .field textarea {
    width: 100%;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    color: var(--text-bright);
    padding: 10px 14px;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 13px;
    border-radius: 4px;
    outline: none;
    transition: border-color 0.25s;
  }

  .field input:focus, .field select:focus, .field textarea:focus {
    border-color: var(--border-hover);
  }

  .field textarea {
    min-height: 80px;
    resize: vertical;
    line-height: 1.6;
  }

  .field select option {
    background: #0b0f1a;
    color: var(--text);
  }

  .connect-section {
    margin-top: 20px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }

  .connect-list {
    max-height: 200px;
    overflow-y: auto;
    margin-top: 8px;
  }

  .connect-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 10px;
    border-radius: 3px;
    margin-bottom: 4px;
    font-size: 12px;
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.04);
  }

  .connect-item .ci-name { color: var(--text); }

  .connect-item .ci-remove {
    background: none;
    border: none;
    color: var(--danger);
    cursor: pointer;
    font-size: 14px;
    opacity: 0.5;
    transition: opacity 0.2s;
  }

  .connect-item .ci-remove:hover { opacity: 1; }

  .connect-add-row {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }

  .connect-add-row select {
    flex: 1;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 10px;
    font-size: 12px;
    border-radius: 3px;
    font-family: 'Zen Kaku Gothic New', sans-serif;
  }

  .panel-actions {
    display: flex;
    gap: 10px;
    margin-top: 24px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }

  .panel-actions .btn { flex: 1; text-align: center; padding: 11px; }

  .overlay-dim {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 250;
    background: rgba(0,0,0,0.4);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }

  .overlay-dim.active {
    opacity: 1;
    pointer-events: auto;
  }

  .context-menu {
    position: fixed;
    z-index: 400;
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 0;
    min-width: 180px;
    backdrop-filter: blur(16px);
    display: none;
  }

  .context-menu.visible { display: block; }

  .context-menu button {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    color: var(--text);
    padding: 9px 18px;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.15s;
  }

  .context-menu button:hover {
    background: rgba(90, 200, 170, 0.08);
  }

  .context-menu button.danger { color: var(--danger); }
  .context-menu button.danger:hover { background: rgba(232, 90, 106, 0.08); }

  .context-menu .sep {
    height: 1px;
    background: var(--border);
    margin: 4px 0;
  }

  .help-hint {
    position: fixed;
    bottom: 52px; left: 28px;
    z-index: 50;
    font-size: 10px;
    color: rgba(200,208,216,0.2);
    letter-spacing: 0.5px;
    line-height: 1.8;
  }

  .toast {
    position: fixed;
    bottom: 80px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    z-index: 500;
    background: var(--panel-bg);
    border: 1px solid var(--border-hover);
    color: var(--accent);
    padding: 10px 24px;
    border-radius: 6px;
    font-size: 12px;
    letter-spacing: 1px;
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(90,200,170,0.15); border-radius: 2px; }
</style>
</head>
<body>

<canvas id="main"></canvas>

<div class="header">
  <div class="brand">
    <div class="brand-icon"></div>
    <div>
      <h1>ACE Knowledge Map</h1>
      <div class="sub">山田式ACEメソッド ナレッジマップ</div>
    </div>
  </div>
  <div class="header-actions">
    <button class="btn" onclick="openAddPanel()">＋ ノード追加</button>
    <button class="btn" onclick="exportData()">エクスポート</button>
    <button class="btn" onclick="importData()">インポート</button>
    <button class="btn" onclick="togglePhysics()" id="physBtn">物理 ON</button>
    <button class="btn btn-danger" onclick="resetAll()">リセット</button>
  </div>
</div>

<div class="stats">
  <div class="stat-item">ノード<span id="sNodes">0</span></div>
  <div class="stat-item">接続<span id="sEdges">0</span></div>
</div>

<div class="help-hint">
  右クリック: 編集メニュー ／ ドラッグ: 移動 ／ ホバー: 詳細
</div>

<div class="legend" id="legend"></div>

<div class="tooltip" id="tooltip">
  <div class="t-name" id="tName"></div>
  <div class="t-cat" id="tCat"></div>
  <div class="t-memo" id="tMemo"></div>
  <div class="t-link" id="tLink"></div>
  <div class="t-conn" id="tConn"></div>
</div>

<div class="overlay-dim" id="overlay" onclick="closePanel()"></div>

<div class="side-panel" id="sidePanel">
  <h2><span id="panelTitle">ノード追加</span><button class="close-btn" onclick="closePanel()">×</button></h2>
  <div class="field">
    <label>名前</label>
    <input type="text" id="fName" placeholder="例: 前頭前皮質の役割">
  </div>
  <div class="field">
    <label>カテゴリ</label>
    <select id="fCat"></select>
  </div>
  <div class="field">
    <label>メモ</label>
    <textarea id="fMemo" placeholder="このノードの説明、要点、受講生へのメッセージなど"></textarea>
  </div>
  <div class="field">
    <label>リンク（noteやURL）</label>
    <input type="text" id="fLink" placeholder="https://note.com/...">
  </div>
  <div class="field">
    <label>サイズ（重要度）</label>
    <input type="range" id="fSize" min="20" max="70" value="35" style="accent-color: var(--accent);">
  </div>

  <div class="connect-section">
    <label style="font-size:10px;letter-spacing:1.5px;color:var(--text-dim);text-transform:uppercase;">接続先</label>
    <div class="connect-list" id="connectList"></div>
    <div class="connect-add-row">
      <select id="connectSelect"><option value="">-- 選択 --</option></select>
      <button class="btn" onclick="addConnection()" style="padding:6px 14px;font-size:10px;">追加</button>
    </div>
  </div>

  <div class="panel-actions">
    <button class="btn" onclick="closePanel()">キャンセル</button>
    <button class="btn" onclick="saveNode()" style="background:rgba(90,200,170,0.15);color:var(--accent);">保存</button>
  </div>
  <div id="deleteRow" style="margin-top:12px;display:none;">
    <button class="btn btn-danger" onclick="deleteNode()" style="width:100%;text-align:center;">このノードを削除</button>
  </div>
</div>

<div class="context-menu" id="ctxMenu">
  <button onclick="ctxEdit()">編集</button>
  <button onclick="ctxAddConnected()">接続ノードを追加</button>
  <div class="sep"></div>
  <button onclick="ctxOpenLink()">リンクを開く</button>
  <div class="sep"></div>
  <button class="danger" onclick="ctxDelete()">削除</button>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="fileInput" accept=".json" style="display:none" onchange="handleImport(event)">

<script>
const STORAGE_KEY = 'ace_knowledge_map_v2';

const CATEGORIES = {
  brain:      { label: '脳科学',         color: [90, 200, 170] },
  body:       { label: '身体・フィジカル', color: [232, 168, 76] },
  mental:     { label: 'メンタル・認知',   color: [106, 142, 240] },
  method:     { label: 'ACEメソッド',     color: [214, 106, 224] },
  casestudy:  { label: '実例・ケース',    color: [232, 224, 90] },
  philosophy: { label: '哲学・思想',      color: [224, 122, 90] },
};

let nodes = [];
let edges = [];
let nextId = 1;
let physicsOn = true;

function saveState() {
  const data = { nodes, edges, nextId };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      nodes = data.nodes || [];
      edges = data.edges || [];
      nextId = data.nextId || 1;
      nodes.forEach(n => { n.vx = n.vx || 0; n.vy = n.vy || 0; });
      return true;
    }
  } catch(e) {}
  return false;
}

function initDemoData() {
  const cx = W / 2, cy = H / 2;
  nodes = [
    { id: 1, name: 'ACEメソッド', cat: 'method', x: cx, y: cy, vx: 0, vy: 0, radius: 55, memo: '山田式ACEメソッドの中核。Athlete Cognitive Educationの略。アスリートの認知能力を科学的に開発する体系。', link: '' },
    { id: 2, name: '前頭前皮質', cat: 'brain', x: cx - 200, y: cy - 150, vx: 0, vy: 0, radius: 38, memo: '意思決定・集中力・自己制御の中枢。ACEメソッドで最も重視する脳領域。', link: '' },
    { id: 3, name: '扁桃体', cat: 'brain', x: cx - 280, y: cy + 20, vx: 0, vy: 0, radius: 34, memo: '恐怖・不安の処理。試合前の緊張を支配。ACEでは扁桃体の過活動を抑制する手法を指導。', link: '' },
    { id: 4, name: 'ミラーニューロン', cat: 'brain', x: cx - 150, y: cy + 160, vx: 0, vy: 0, radius: 32, memo: '他者の動作を「脳内模倣」する神経。技術習得とイメージトレーニングの根拠。', link: '' },
    { id: 5, name: 'フロー状態', cat: 'mental', x: cx + 220, y: cy - 120, vx: 0, vy: 0, radius: 40, memo: '最高のパフォーマンスが出る心理状態。チクセントミハイの理論をACEが実践に落とし込む。', link: '' },
    { id: 6, name: '試合前ルーティン', cat: 'method', x: cx + 180, y: cy + 80, vx: 0, vy: 0, radius: 36, memo: '脳科学に基づく試合前の心身準備プロトコル。前頭前皮質を活性化し、扁桃体を鎮静化する。', link: '' },
    { id: 7, name: 'セパタクロー20年の知見', cat: 'casestudy', x: cx + 50, y: cy + 220, vx: 0, vy: 0, radius: 42, memo: '30回以上の全国タイトル、世界選手権銀メダル、アジア大会銅メダル。この経験が全理論の根拠。', link: '' },
    { id: 8, name: '怪我からの復帰', cat: 'body', x: cx - 50, y: cy - 230, vx: 0, vy: 0, radius: 34, memo: 'サッカーからセパタクローへの転向のきっかけ。怪我予防と身体管理の原点。', link: '' },
    { id: 9, name: '死ぬ直前の"イキ"', cat: 'philosophy', x: cx + 300, y: cy + 200, vx: 0, vy: 0, radius: 36, memo: '「死ぬ直前の"イキ"を、ヒトをいかす為に使え」— ACE哲学の根幹。多層的意味を持つ原理。', link: '' },
    { id: 10, name: 'イメージトレーニング', cat: 'method', x: cx - 300, y: cy - 80, vx: 0, vy: 0, radius: 33, memo: 'ミラーニューロンを活用した脳内リハーサル。ACEメソッドの実践技術。', link: '' },
    { id: 11, name: '自律神経コントロール', cat: 'body', x: cx + 100, y: cy - 250, vx: 0, vy: 0, radius: 32, memo: '交感神経と副交感神経の切替技術。フロー状態への入口。', link: '' },
    { id: 12, name: '勝者の脳', cat: 'brain', x: cx + 350, y: cy - 30, vx: 0, vy: 0, radius: 38, memo: 'ACEが目指す脳の状態。前頭前皮質が主導し、扁桃体が適切に制御された状態。', link: '' },
  ];
  edges = [
    { from: 1, to: 2, strength: 0.9 }, { from: 1, to: 5, strength: 0.8 },
    { from: 1, to: 6, strength: 0.9 }, { from: 1, to: 7, strength: 0.7 },
    { from: 1, to: 9, strength: 0.8 }, { from: 1, to: 12, strength: 0.9 },
    { from: 2, to: 3, strength: 0.7 }, { from: 2, to: 5, strength: 0.6 },
    { from: 2, to: 12, strength: 0.8 }, { from: 3, to: 6, strength: 0.7 },
    { from: 3, to: 11, strength: 0.5 }, { from: 4, to: 10, strength: 0.8 },
    { from: 4, to: 7, strength: 0.4 }, { from: 5, to: 6, strength: 0.7 },
    { from: 5, to: 11, strength: 0.6 }, { from: 5, to: 12, strength: 0.7 },
    { from: 6, to: 7, strength: 0.5 }, { from: 7, to: 8, strength: 0.6 },
    { from: 7, to: 9, strength: 0.5 }, { from: 8, to: 11, strength: 0.5 },
    { from: 9, to: 12, strength: 0.6 }, { from: 10, to: 2, strength: 0.5 },
  ];
  nextId = 13;
  saveState();
}

const canvas = document.getElementById('main');
const ctx = canvas.getContext('2d');
let W, H, time = 0;

function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

function drawHexPath(ctx2, x, y, r, rotation) {
  ctx2.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2 + rotation;
    i === 0 ? ctx2.moveTo(x + Math.cos(a)*r, y + Math.sin(a)*r)
            : ctx2.lineTo(x + Math.cos(a)*r, y + Math.sin(a)*r);
  }
  ctx2.closePath();
}

function drawEdge(n1, n2, strength, t) {
  const c1 = CATEGORIES[n1.cat]?.color || [150,150,150], c2 = CATEGORIES[n2.cat]?.color || [150,150,150];
  const dx = n2.x-n1.x, dy = n2.y-n1.y, dist = Math.max(Math.sqrt(dx*dx+dy*dy), 1);
  const segs = 24, amp = 6 + strength * 4;
  ctx.beginPath();
  for (let i = 0; i <= segs; i++) {
    const f = i/segs, px = n1.x+dx*f, py = n1.y+dy*f;
    const wave = Math.sin(f*Math.PI*3.5+t*1.4)*amp*Math.sin(f*Math.PI);
    const fx = px + (-dy/dist)*wave, fy = py + (dx/dist)*wave;
    if (i===0) ctx.moveTo(fx,fy); else ctx.lineTo(fx,fy);
  }
  const mr=(c1[0]+c2[0])/2, mg=(c1[1]+c2[1])/2, mb=(c1[2]+c2[2])/2;
  ctx.strokeStyle = `rgba(${mr},${mg},${mb},${0.06+strength*0.12})`; ctx.lineWidth = 0.8+strength*2; ctx.stroke();
  const np = Math.floor(1+strength*2);
  for (let p = 0; p < np; p++) {
    const phase = ((t*0.25+p/np)%1), px = n1.x+dx*phase, py = n1.y+dy*phase;
    const wave = Math.sin(phase*Math.PI*3.5+t*1.4)*amp*Math.sin(phase*Math.PI);
    ctx.beginPath(); ctx.arc(px+(-dy/dist)*wave, py+(dx/dist)*wave, 1.2+strength*0.8, 0, Math.PI*2);
    ctx.fillStyle = `rgba(${mr},${mg},${mb},${0.25+strength*0.25})`; ctx.fill();
  }
}

function drawNode(node, t) {
  const cat = CATEGORIES[node.cat] || { color: [150,150,150] }, col = cat.color;
  const isHov = node === hoveredNode;
  const scale = isHov ? 1.1 : 1;
  const glow = isHov ? 32 : 12;
  const alpha = isHov ? 1 : 0.85;
  const x = node.x, y = node.y;
  const pulse = 1 + Math.sin(t * 1.3 + node.id * 0.7) * 0.025;
  const r = node.radius * scale * pulse;

  // === 亀甲: 外側六角形（フラットトップ）===
  const outerRot = -Math.PI / 6; // flat-top
  drawHexPath(ctx, x, y, r, outerRot);
  if (glow > 0) { ctx.shadowColor = `rgba(${col[0]},${col[1]},${col[2]},0.45)`; ctx.shadowBlur = glow; }
  const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
  grad.addColorStop(0, `rgba(${col[0]},${col[1]},${col[2]},${alpha * 0.22})`);
  grad.addColorStop(1, `rgba(${col[0]},${col[1]},${col[2]},${alpha * 0.04})`);
  ctx.fillStyle = grad; ctx.fill(); ctx.shadowBlur = 0;
  ctx.strokeStyle = `rgba(${col[0]},${col[1]},${col[2]},${alpha * 0.7})`; ctx.lineWidth = 1.5; ctx.stroke();

  // === 亀甲: 内側六角形（30°回転 = ポインテッドトップ）===
  const ri = r * 0.58;
  drawHexPath(ctx, x, y, ri, 0);
  ctx.strokeStyle = `rgba(${col[0]},${col[1]},${col[2]},${alpha * 0.22})`; ctx.lineWidth = 0.8; ctx.stroke();

  // 亀甲: 外頂点→内頂点への接続線
  ctx.strokeStyle = `rgba(${col[0]},${col[1]},${col[2]},${alpha * 0.15})`; ctx.lineWidth = 0.6;
  for (let i = 0; i < 6; i++) {
    const ao = (i / 6) * Math.PI * 2 + outerRot;
    const ai = (i / 6) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(x + Math.cos(ao)*r, y + Math.sin(ao)*r);
    ctx.lineTo(x + Math.cos(ai)*ri, y + Math.sin(ai)*ri);
    ctx.stroke();
  }

  // === 麻の葉: 2つの三角形（ゆっくり回転）===
  const rot = t * 0.05 + node.id * 0.4;
  const rs = r * 0.36;
  for (let tri = 0; tri < 2; tri++) {
    ctx.beginPath();
    for (let i = 0; i < 3; i++) {
      const a = (i / 3) * Math.PI * 2 + rot + (tri * Math.PI / 3);
      i === 0 ? ctx.moveTo(x + Math.cos(a)*rs, y + Math.sin(a)*rs)
              : ctx.lineTo(x + Math.cos(a)*rs, y + Math.sin(a)*rs);
    }
    ctx.closePath();
    ctx.strokeStyle = `rgba(${col[0]},${col[1]},${col[2]},${alpha * 0.35})`; ctx.lineWidth = 0.7; ctx.stroke();
  }

  // 麻の葉: 中心から各葉への補助線
  ctx.strokeStyle = `rgba(${col[0]},${col[1]},${col[2]},${alpha * 0.12})`; ctx.lineWidth = 0.5;
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2 + rot;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a)*rs, y + Math.sin(a)*rs); ctx.stroke();
  }

  // 中心点
  ctx.beginPath(); ctx.arc(x, y, 1.8, 0, Math.PI*2);
  ctx.fillStyle = `rgba(${col[0]},${col[1]},${col[2]},${alpha * 0.5})`; ctx.fill();

  // === テキスト ===
  const fontSize = node.radius > 40 ? 13 : node.radius > 30 ? 11 : 10;
  ctx.font = `${node.radius>45?700:500} ${fontSize}px 'Zen Kaku Gothic New'`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = `rgba(${col[0]},${col[1]},${col[2]},${isHov?0.95:0.78})`;
  const name = node.name;
  if (name.length > 8 && node.radius < 45) {
    const mid = Math.ceil(name.length/2);
    ctx.fillText(name.slice(0,mid), x, y-fontSize*0.45);
    ctx.fillText(name.slice(mid), x, y+fontSize*0.55);
  } else { ctx.fillText(name, x, y); }
  if (node.link) { ctx.beginPath(); ctx.arc(x+node.radius*0.7, y-node.radius*0.7, 4, 0, Math.PI*2); ctx.fillStyle=`rgba(${col[0]},${col[1]},${col[2]},0.5)`; ctx.fill(); ctx.strokeStyle=`rgba(${col[0]},${col[1]},${col[2]},0.8)`; ctx.lineWidth=1; ctx.stroke(); }
  if (node.memo) { ctx.beginPath(); ctx.arc(x-node.radius*0.7, y-node.radius*0.7, 3, 0, Math.PI*2); ctx.fillStyle='rgba(255,255,255,0.15)'; ctx.fill(); }
}

function simulate() {
  if (!physicsOn) return;
  const kR=7000, kA=0.003, kC=0.0002, damp=0.91, ideal=170;
  for (let i=0;i<nodes.length;i++) for (let j=i+1;j<nodes.length;j++) {
    const dx=nodes[j].x-nodes[i].x, dy=nodes[j].y-nodes[i].y, d=Math.max(Math.sqrt(dx*dx+dy*dy),1), f=kR/(d*d);
    nodes[i].vx-=(dx/d)*f; nodes[i].vy-=(dy/d)*f; nodes[j].vx+=(dx/d)*f; nodes[j].vy+=(dy/d)*f;
  }
  for (const e of edges) {
    const n1=nodes.find(n=>n.id===e.from), n2=nodes.find(n=>n.id===e.to);
    if (!n1||!n2) continue;
    const dx=n2.x-n1.x, dy=n2.y-n1.y, d=Math.max(Math.sqrt(dx*dx+dy*dy),1), f=(d-ideal)*kA*e.strength;
    n1.vx+=(dx/d)*f; n1.vy+=(dy/d)*f; n2.vx-=(dx/d)*f; n2.vy-=(dy/d)*f;
  }
  for (const n of nodes) { n.vx+=(W/2-n.x)*kC; n.vy+=(H/2-n.y)*kC; }
  for (const n of nodes) {
    if (n===dragNode) continue;
    n.vx*=damp; n.vy*=damp; n.x+=n.vx; n.y+=n.vy;
    n.x=Math.max(n.radius+10, Math.min(W-n.radius-10, n.x));
    n.y=Math.max(n.radius+60, Math.min(H-n.radius-10, n.y));
  }
}

function render() {
  time += 0.016;
  ctx.clearRect(0,0,W,H);
  const bg = ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,W*0.7);
  bg.addColorStop(0,'#0d1020'); bg.addColorStop(1,'#06080e');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(90,200,170,0.012)'; ctx.lineWidth=1;
  for (let x=0;x<W;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for (let y=0;y<H;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  simulate();
  for (const e of edges) { const n1=nodes.find(n=>n.id===e.from),n2=nodes.find(n=>n.id===e.to); if(n1&&n2) drawEdge(n1,n2,e.strength,time); }
  for (const n of nodes) drawNode(n, time);
  updateStats();
  requestAnimationFrame(render);
}

let dragNode=null, hoveredNode=null, dragOX=0, dragOY=0, ctxTarget=null;

function getNodeAt(x,y) {
  for (let i=nodes.length-1;i>=0;i--) { const dx=x-nodes[i].x, dy=y-nodes[i].y; if(dx*dx+dy*dy<nodes[i].radius*nodes[i].radius*1.4) return nodes[i]; }
  return null;
}

canvas.addEventListener('mousedown', e => { if(e.button!==0)return; hideCtxMenu(); const n=getNodeAt(e.clientX,e.clientY); if(n){dragNode=n;dragOX=e.clientX-n.x;dragOY=e.clientY-n.y;} });
canvas.addEventListener('mousemove', e => {
  if(dragNode){dragNode.x=e.clientX-dragOX;dragNode.y=e.clientY-dragOY;dragNode.vx=0;dragNode.vy=0;}
  const n=getNodeAt(e.clientX,e.clientY); hoveredNode=n;
  const tip=document.getElementById('tooltip');
  if(n&&!dragNode){
    const cat=CATEGORIES[n.cat];
    document.getElementById('tName').textContent=n.name;
    document.getElementById('tName').style.color=`rgb(${cat?.color?.join(',')||'200,200,200'})`;
    document.getElementById('tCat').textContent=cat?.label||n.cat;
    document.getElementById('tMemo').textContent=n.memo||''; document.getElementById('tMemo').style.display=n.memo?'block':'none';
    document.getElementById('tLink').textContent=n.link||''; document.getElementById('tLink').style.display=n.link?'block':'none';
    document.getElementById('tConn').textContent=`接続: ${edges.filter(e=>e.from===n.id||e.to===n.id).length}`;
    tip.style.left=(e.clientX+18)+'px'; tip.style.top=(e.clientY-10)+'px'; tip.classList.add('visible');
    canvas.style.cursor='grab';
  } else { tip.classList.remove('visible'); canvas.style.cursor=dragNode?'grabbing':'default'; }
});
canvas.addEventListener('mouseup', () => { if(dragNode){saveState();dragNode=null;} });
canvas.addEventListener('contextmenu', e => { e.preventDefault(); const n=getNodeAt(e.clientX,e.clientY); if(!n){hideCtxMenu();return;} ctxTarget=n; const menu=document.getElementById('ctxMenu'); menu.style.left=e.clientX+'px'; menu.style.top=e.clientY+'px'; menu.classList.add('visible'); });
document.addEventListener('click', e => { if(!e.target.closest('.context-menu')) hideCtxMenu(); });
function hideCtxMenu() { document.getElementById('ctxMenu').classList.remove('visible'); }

canvas.addEventListener('touchstart', e => { e.preventDefault(); const t=e.touches[0], n=getNodeAt(t.clientX,t.clientY); if(n){dragNode=n;dragOX=t.clientX-n.x;dragOY=t.clientY-n.y;} }, {passive:false});
canvas.addEventListener('touchmove', e => { e.preventDefault(); if(dragNode){const t=e.touches[0];dragNode.x=t.clientX-dragOX;dragNode.y=t.clientY-dragOY;dragNode.vx=0;dragNode.vy=0;} }, {passive:false});
canvas.addEventListener('touchend', () => { if(dragNode){saveState();dragNode=null;} });
let longPressTimer=null;
canvas.addEventListener('touchstart', e => { const t=e.touches[0], n=getNodeAt(t.clientX,t.clientY); if(n){ longPressTimer=setTimeout(()=>{ ctxTarget=n; const menu=document.getElementById('ctxMenu'); menu.style.left=t.clientX+'px'; menu.style.top=t.clientY+'px'; menu.classList.add('visible'); dragNode=null; },600); } });
canvas.addEventListener('touchend', ()=>{clearTimeout(longPressTimer);});
canvas.addEventListener('touchmove', ()=>{clearTimeout(longPressTimer);});

let editingNodeId=null, panelConnections=[];

function openAddPanel(preconnectId) {
  editingNodeId=null; panelConnections=preconnectId?[preconnectId]:[];
  document.getElementById('panelTitle').textContent='ノード追加';
  document.getElementById('fName').value=''; document.getElementById('fMemo').value='';
  document.getElementById('fLink').value=''; document.getElementById('fSize').value=35;
  document.getElementById('deleteRow').style.display='none';
  populateCatSelect(); refreshConnectUI(); showPanel();
}

function openEditPanel(node) {
  editingNodeId=node.id;
  panelConnections=edges.filter(e=>e.from===node.id||e.to===node.id).map(e=>e.from===node.id?e.to:e.from);
  document.getElementById('panelTitle').textContent='ノード編集';
  document.getElementById('fName').value=node.name; document.getElementById('fMemo').value=node.memo||'';
  document.getElementById('fLink').value=node.link||''; document.getElementById('fSize').value=node.radius;
  document.getElementById('deleteRow').style.display='block';
  populateCatSelect(); document.getElementById('fCat').value=node.cat; refreshConnectUI(); showPanel();
}

function populateCatSelect() {
  const sel=document.getElementById('fCat'); sel.innerHTML='';
  for (const [k,v] of Object.entries(CATEGORIES)) { const o=document.createElement('option'); o.value=k; o.textContent=v.label; sel.appendChild(o); }
}

function refreshConnectUI() {
  const list=document.getElementById('connectList'); list.innerHTML='';
  panelConnections.forEach(id => {
    const n=nodes.find(nn=>nn.id===id); if(!n)return;
    const col=CATEGORIES[n.cat]?.color||[150,150,150];
    const div=document.createElement('div'); div.className='connect-item';
    div.innerHTML=`<span class="ci-name" style="color:rgb(${col.join(',')})">${n.name}</span>`;
    const btn=document.createElement('button'); btn.className='ci-remove'; btn.textContent='×';
    btn.onclick=()=>{panelConnections=panelConnections.filter(i=>i!==id);refreshConnectUI();}; div.appendChild(btn); list.appendChild(div);
  });
  const sel=document.getElementById('connectSelect'); sel.innerHTML='<option value="">-- 選択 --</option>';
  nodes.forEach(n=>{if(n.id===editingNodeId||panelConnections.includes(n.id))return; const o=document.createElement('option');o.value=n.id;o.textContent=n.name;sel.appendChild(o);});
}

function addConnection() { const id=parseInt(document.getElementById('connectSelect').value); if(!id)return; panelConnections.push(id); refreshConnectUI(); }

function saveNode() {
  const name=document.getElementById('fName').value.trim(); if(!name) return;
  const cat=document.getElementById('fCat').value, memo=document.getElementById('fMemo').value.trim();
  const link=document.getElementById('fLink').value.trim(), radius=parseInt(document.getElementById('fSize').value);
  if (editingNodeId!==null) {
    const node=nodes.find(n=>n.id===editingNodeId);
    if(node){node.name=name;node.cat=cat;node.memo=memo;node.link=link;node.radius=radius;
    edges=edges.filter(e=>e.from!==node.id&&e.to!==node.id);
    panelConnections.forEach(tid=>{edges.push({from:node.id,to:tid,strength:0.5});});}
  } else {
    const id=nextId++, angle=Math.random()*Math.PI*2, dist=120+Math.random()*80;
    nodes.push({id,name,cat,memo,link,radius,x:W/2+Math.cos(angle)*dist,y:H/2+Math.sin(angle)*dist,vx:0,vy:0});
    panelConnections.forEach(tid=>{edges.push({from:id,to:tid,strength:0.5});});
  }
  saveState(); closePanel();
}

function deleteNode() {
  if(editingNodeId===null)return; if(!confirm('このノードを削除しますか？'))return;
  nodes=nodes.filter(n=>n.id!==editingNodeId); edges=edges.filter(e=>e.from!==editingNodeId&&e.to!==editingNodeId);
  saveState(); closePanel();
}

function showPanel(){document.getElementById('sidePanel').classList.add('open');document.getElementById('overlay').classList.add('active');}
function closePanel(){document.getElementById('sidePanel').classList.remove('open');document.getElementById('overlay').classList.remove('active');editingNodeId=null;}

function ctxEdit(){hideCtxMenu();if(ctxTarget)openEditPanel(ctxTarget);}
function ctxAddConnected(){hideCtxMenu();if(ctxTarget)openAddPanel(ctxTarget.id);}
function ctxOpenLink(){hideCtxMenu();if(ctxTarget&&ctxTarget.link)window.open(ctxTarget.link,'_blank');}
function ctxDelete(){hideCtxMenu();if(!ctxTarget)return;if(!confirm(`「${ctxTarget.name}」を削除しますか？`))return;nodes=nodes.filter(n=>n.id!==ctxTarget.id);edges=edges.filter(e=>e.from!==ctxTarget.id&&e.to!==ctxTarget.id);saveState();}

function togglePhysics(){physicsOn=!physicsOn;document.getElementById('physBtn').textContent=physicsOn?'物理 ON':'物理 OFF';}
function resetAll(){if(!confirm('全データをリセットしてデモデータに戻しますか？'))return;initDemoData();}

function exportData() {
  const data={nodes,edges,nextId,exportedAt:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download=`ace-knowledge-map-${new Date().toISOString().slice(0,10)}.json`; a.click(); URL.revokeObjectURL(url);
  showToast('エクスポート完了');
}

function importData(){document.getElementById('fileInput').click();}

function handleImport(e) {
  const file=e.target.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=(ev)=>{try{const data=JSON.parse(ev.target.result);if(data.nodes&&data.edges){nodes=data.nodes;edges=data.edges;nextId=data.nextId||Math.max(...nodes.map(n=>n.id))+1;nodes.forEach(n=>{n.vx=0;n.vy=0;});saveState();showToast('インポート完了');}}catch(err){showToast('ファイル読み込みエラー');}};
  reader.readAsText(file); e.target.value='';
}

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}
function updateStats(){document.getElementById('sNodes').textContent=nodes.length;document.getElementById('sEdges').textContent=edges.length;}

function buildLegend() {
  const el=document.getElementById('legend'); el.innerHTML='';
  for (const [k,v] of Object.entries(CATEGORIES)) {
    const item=document.createElement('div'); item.className='legend-item';
    item.innerHTML=`<div class="legend-dot" style="background:rgb(${v.color.join(',')})"></div>${v.label}`;
    el.appendChild(item);
  }
}

buildLegend();
if (!loadState()) initDemoData();
render();
</script>
</body>
