<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#07110f" />
<title>ACE Knowledge Map</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap');
:root{--bg:#06100e;--panel:rgba(10,24,21,.88);--panel2:rgba(14,31,27,.72);--line:rgba(157,220,196,.14);--line2:rgba(157,220,196,.28);--text:#e7f0ec;--muted:#8ba49a;--accent:#78d9b5;--accent2:#d8ef91;--danger:#ff8f9a}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% -10%,#16342a 0,#081613 38%,#050b0a 76%);color:var(--text);font-family:Inter,'Zen Kaku Gothic New',sans-serif}button,input{font:inherit}button{color:inherit}
#graph{position:fixed;inset:0;width:100%;height:100%;display:block}.noise{position:fixed;inset:0;pointer-events:none;opacity:.16;background-image:radial-gradient(rgba(255,255,255,.24) .45px,transparent .45px);background-size:6px 6px;mix-blend-mode:soft-light}
.topbar{position:fixed;z-index:20;left:22px;right:22px;top:18px;display:flex;align-items:center;gap:14px;pointer-events:none}.brand{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--line);background:rgba(6,16,14,.62);backdrop-filter:blur(18px);border-radius:16px;box-shadow:0 12px 50px rgba(0,0,0,.22)}.mark{width:30px;height:30px;border-radius:10px;background:radial-gradient(circle at 35% 30%,#d8ef91,#72d5b1 38%,#15372d 75%);box-shadow:0 0 25px rgba(120,217,181,.22)}.brand-title{font-size:13px;letter-spacing:.14em;font-weight:700}.brand-sub{font-size:10px;color:var(--muted);margin-top:2px}.spacer{flex:1}.status{pointer-events:auto;display:flex;align-items:center;gap:8px;padding:8px 11px;border:1px solid var(--line);background:rgba(6,16,14,.62);backdrop-filter:blur(18px);border-radius:999px;font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}.status-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px rgba(120,217,181,.7)}.status.private .status-dot{background:var(--accent2)}
.btn{pointer-events:auto;border:1px solid var(--line2);background:rgba(16,39,33,.66);border-radius:12px;padding:9px 13px;font-size:11px;font-weight:600;letter-spacing:.04em;cursor:pointer;transition:.2s}.btn:hover{transform:translateY(-1px);border-color:rgba(120,217,181,.5);background:rgba(26,57,48,.8)}.btn.ghost{background:rgba(5,12,10,.45);color:#b9cbc4}.btn.danger{color:#ffb3bb;border-color:rgba(255,143,154,.25)}
.search-wrap{position:fixed;z-index:20;top:84px;left:50%;transform:translateX(-50%);width:min(620px,calc(100vw - 44px))}.search{width:100%;outline:none;border:1px solid var(--line);background:rgba(7,18,15,.84);backdrop-filter:blur(20px);color:var(--text);padding:14px 46px 14px 17px;border-radius:17px;box-shadow:0 18px 65px rgba(0,0,0,.25);font-size:13px}.search::placeholder{color:#668078}.search-icon{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:#6f8f83;font-size:15px}
.bottom{position:fixed;z-index:20;left:22px;right:22px;bottom:18px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}.metrics{pointer-events:auto;display:flex;gap:6px;padding:6px;border:1px solid var(--line);background:rgba(6,16,14,.62);backdrop-filter:blur(16px);border-radius:14px}.metric{padding:7px 10px;border-radius:10px;background:rgba(255,255,255,.025);min-width:70px}.metric strong{display:block;font-size:15px}.metric span{font-size:9px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}.hint{pointer-events:auto;color:#668078;font-size:10px;padding:8px 10px;background:rgba(6,16,14,.45);border-radius:10px;border:1px solid rgba(157,220,196,.08)}
.panel{position:fixed;z-index:40;top:0;right:-470px;width:min(440px,94vw);height:100%;background:linear-gradient(180deg,rgba(10,25,21,.98),rgba(5,12,10,.98));border-left:1px solid var(--line);box-shadow:-30px 0 80px rgba(0,0,0,.35);transition:right .28s ease;overflow:auto}.panel.open{right:0}.panel-inner{padding:26px 26px 38px}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.eyebrow{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent)}.close{border:0;background:none;font-size:25px;color:#789188;cursor:pointer}.node-title{font-size:25px;line-height:1.35;margin:5px 0 12px;letter-spacing:-.02em}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:22px}.chip{font-size:9px;color:#a6bbb3;border:1px solid var(--line);padding:5px 8px;border-radius:999px;background:rgba(255,255,255,.025)}.section{padding:18px 0;border-top:1px solid var(--line)}.section h3{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#6f8f83;margin:0 0 10px}.section p{margin:0;color:#cbdad4;font-size:13px;line-height:1.8;white-space:pre-wrap}.relation{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;background:transparent;color:#cfe0d9;padding:8px 0;cursor:pointer}.relation:hover{color:var(--accent)}.rel-dot{width:7px;height:7px;border-radius:50%;background:#567d6e}.rel-type{margin-left:auto;color:#658077;font-size:9px}
.modal-back{position:fixed;z-index:60;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:20px}.modal-back.open{display:flex}.modal{width:min(430px,100%);border:1px solid var(--line2);border-radius:22px;background:linear-gradient(180deg,#10241f,#08120f);padding:28px;box-shadow:0 30px 100px rgba(0,0,0,.55)}.modal h2{font-size:20px;margin:5px 0 10px}.modal p{font-size:12px;line-height:1.7;color:#91aaa1;margin:0 0 20px}.field{width:100%;outline:none;color:var(--text);background:rgba(255,255,255,.04);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;margin-bottom:10px}.modal-actions{display:flex;gap:9px}.modal-actions .btn{flex:1}.message{font-size:11px;line-height:1.5;color:var(--accent);min-height:17px;margin-top:12px}.message.error{color:var(--danger)}
.empty{position:fixed;z-index:10;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none}.empty.show{display:flex}.empty-card{text-align:center;padding:24px 28px;border:1px solid var(--line);background:rgba(6,16,14,.64);backdrop-filter:blur(16px);border-radius:18px}.empty-card strong{display:block;font-size:15px}.empty-card span{display:block;font-size:11px;color:var(--muted);margin-top:6px}
.loading{position:fixed;z-index:80;inset:0;display:flex;align-items:center;justify-content:center;background:#06100e;transition:opacity .35s}.loading.hide{opacity:0;pointer-events:none}.loader{width:34px;height:34px;border-radius:50%;border:2px solid rgba(120,217,181,.12);border-top-color:var(--accent);animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:720px){.topbar{left:12px;right:12px;top:10px}.brand{padding:8px 10px}.brand-sub{display:none}.status{display:none}.search-wrap{top:70px;width:calc(100vw - 24px)}.bottom{left:12px;right:12px;bottom:10px}.hint{display:none}.metric{min-width:58px;padding:6px 8px}.metric strong{font-size:13px}.panel-inner{padding:22px 20px 34px}.node-title{font-size:22px}}
</style>
</head>
<body>
<canvas id="graph"></canvas><div class="noise"></div>
<div class="topbar">
  <div class="brand"><div class="mark"></div><div><div class="brand-title">ACE KNOWLEDGE MAP</div><div class="brand-sub" id="brandSub">connected knowledge · live core</div></div></div>
  <div class="spacer"></div>
  <div class="status" id="accessStatus"><span class="status-dot"></span><span>PUBLIC VIEW</span></div>
  <button class="btn ghost" id="authBtn">OWNER LOGIN</button>
</div>
<div class="search-wrap"><input id="search" class="search" autocomplete="off" placeholder="Search concepts, notes, aliases…"/><span class="search-icon">⌕</span></div>
<div class="bottom"><div class="metrics"><div class="metric"><strong id="nodeCount">0</strong><span>concepts</span></div><div class="metric"><strong id="edgeCount">0</strong><span>links</span></div><div class="metric"><strong id="domainCount">0</strong><span>domains</span></div></div><div class="hint">drag · zoom · click to explore</div></div>
<div id="detail" class="panel"><div class="panel-inner"><div class="panel-head"><div class="eyebrow" id="detailMode">KNOWLEDGE NODE</div><button class="close" id="closeDetail">×</button></div><div id="detailBody"></div></div></div>
<div id="authModal" class="modal-back"><div class="modal"><div class="eyebrow">PRIVATE CORE</div><h2 id="authTitle">Owner login</h2><p id="authText">登録したメールアドレスにログインリンクを送ります。ログイン後の閲覧範囲はSupabaseの権限設定で制御されます。</p><input id="email" class="field" type="email" placeholder="you@example.com"/><div class="modal-actions"><button class="btn ghost" id="cancelAuth">CANCEL</button><button class="btn" id="sendAuth">SEND LINK</button></div><div id="authMessage" class="message"></div></div></div>
<div id="empty" class="empty"><div class="empty-card"><strong>No matching knowledge</strong><span>検索条件を変えてください</span></div></div>
<div id="loading" class="loading"><div class="loader"></div></div>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL='https://qydbtholbwbuwiswmqsr.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_mv8O-7lEXnuubYLVzXIJnA_A1irQJB9';
const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const canvas=document.getElementById('graph'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
const palette=['#78d9b5','#d8ef91','#8fc6ff','#d9a7ff','#ffb98f','#91e1df','#f5d77d','#a9b8ff','#e8a5b0'];
let W=0,H=0,dpr=1,items=[],relations=[],aliases=[],nodes=[],session=null,profile=null,selected=null,hovered=null,query='',pan={x:0,y:0},zoom=1,drag=null,last={x:0,y:0},frame=0;
const positionsKey='ace-kmap-positions-v2';
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
function hash(s=''){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)}
function colorFor(v){return palette[hash(v||'other')%palette.length]}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function savedPositions(){try{return JSON.parse(localStorage.getItem(positionsKey)||'{}')}catch{return {}}}
function savePositions(){const p={};nodes.forEach(n=>p[n.id]={x:n.x,y:n.y});localStorage.setItem(positionsKey,JSON.stringify(p))}
function makeNodes(){const saved=savedPositions(),cx=W/2,cy=H/2,r=Math.min(W,H)*.32;nodes=items.map((item,i)=>{const a=(i/Math.max(items.length,1))*Math.PI*2+(hash(item.id)%100)/200;const sp=saved[item.id];return {...item,x:sp?.x??cx+Math.cos(a)*r*(.55+Math.random()*.45),y:sp?.y??cy+Math.sin(a)*r*(.55+Math.random()*.45),vx:0,vy:0,r:11+Math.min(16,(relations.filter(e=>e.from_id===item.id||e.to_id===item.id).length)*1.4),color:colorFor(item.domain||item.layer)}})}
function visibleNodes(){if(!query)return nodes;const q=query.toLowerCase();return nodes.filter(n=>{const aa=aliases.filter(a=>a.knowledge_id===n.id).map(a=>a.alias).join(' ');return [n.title,n.summary,n.content,n.domain,n.layer,n.item_type,aa].filter(Boolean).join(' ').toLowerCase().includes(q)})}
function fitInitial(){if(!nodes.length)return;const xs=nodes.map(n=>n.x),ys=nodes.map(n=>n.y);const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);const bw=Math.max(500,maxX-minX+180),bh=Math.max(400,maxY-minY+180);zoom=Math.min(1.05,Math.max(.45,Math.min((W-70)/bw,(H-150)/bh)));pan.x=W/2-((minX+maxX)/2)*zoom;pan.y=H/2-((minY+maxY)/2)*zoom}
async function loadSession(){const {data}=await supabase.auth.getSession();session=data.session||null;await loadProfile();updateAuthUI()}
async function loadProfile(){profile=null;if(!session)return;const {data}=await supabase.from('profiles').select('display_name,contribution_level').eq('id',session.user.id).maybeSingle();profile=data||null}
async function loadData(){const [ki,kr,ka]=await Promise.all([
 supabase.from('knowledge_items').select('id,slug,title,layer,item_type,domain,summary,content,evidence_level,confidence,visibility,status,updated_at').order('title'),
 supabase.from('knowledge_relations').select('id,from_id,to_id,relation,weight,reason'),
 supabase.from('knowledge_aliases').select('knowledge_id,alias')
]);
 if(ki.error)throw ki.error;if(kr.error)throw kr.error;if(ka.error)throw ka.error;items=ki.data||[];relations=kr.data||[];aliases=ka.data||[];makeNodes();fitInitial();updateMetrics();$('loading').classList.add('hide')}
function updateMetrics(){const vis=visibleNodes();$('nodeCount').textContent=vis.length;$('edgeCount').textContent=relations.filter(e=>vis.some(n=>n.id===e.from_id)&&vis.some(n=>n.id===e.to_id)).length;$('domainCount').textContent=new Set(vis.map(n=>n.domain||n.layer).filter(Boolean)).size;$('empty').classList.toggle('show',vis.length===0)}
function updateAuthUI(){const status=$('accessStatus'),btn=$('authBtn');if(!session){status.className='status';status.querySelector('span:last-child').textContent='PUBLIC VIEW';btn.textContent='OWNER LOGIN';$('brandSub').textContent='connected knowledge · live core'}else{const level=profile?.contribution_level??0;status.className='status '+(level>=4?'private':'');status.querySelector('span:last-child').textContent=level>=4?'PRIVATE CORE':'SIGNED IN';btn.textContent='LOG OUT';$('brandSub').textContent=level>=4?'private knowledge core · authenticated':'authenticated · limited access'}}
function screen(n){return {x:n.x*zoom+pan.x,y:n.y*zoom+pan.y,r:Math.max(5,n.r*zoom)}}
function nodeAt(x,y){const vis=visibleNodes();for(let i=vis.length-1;i>=0;i--){const n=vis[i],p=screen(n),dx=x-p.x,dy=y-p.y;if(dx*dx+dy*dy<(p.r+9)*(p.r+9))return n}return null}
function physics(){if(drag?.node)return;const visSet=new Set(visibleNodes().map(n=>n.id));for(let i=0;i<nodes.length;i++){const a=nodes[i];if(!visSet.has(a.id))continue;for(let j=i+1;j<nodes.length;j++){const b=nodes[j];if(!visSet.has(b.id))continue;let dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy+1,d=Math.sqrt(d2);const f=Math.min(1.3,900/d2);a.vx-=dx/d*f;b.vx+=dx/d*f;a.vy-=dy/d*f;b.vy+=dy/d*f}}
 relations.forEach(e=>{if(!visSet.has(e.from_id)||!visSet.has(e.to_id))return;const a=nodes.find(n=>n.id===e.from_id),b=nodes.find(n=>n.id===e.to_id);if(!a||!b)return;let dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||1,target=115+Math.max(0,30-(Number(e.weight)||1)*10),f=(d-target)*.0007;a.vx+=dx/d*f;b.vx-=dx/d*f;a.vy+=dy/d*f;b.vy-=dy/d*f});
 const cx=(W/2-pan.x)/zoom,cy=(H/2-pan.y)/zoom;nodes.forEach(n=>{if(!visSet.has(n.id))return;n.vx+=(cx-n.x)*.00003;n.vy+=(cy-n.y)*.00003;n.vx*=.91;n.vy*=.91;n.x+=n.vx;n.y+=n.vy})}
function draw(){frame=requestAnimationFrame(draw);physics();ctx.clearRect(0,0,W,H);const vis=visibleNodes(),visSet=new Set(vis.map(n=>n.id));ctx.save();ctx.globalCompositeOperation='source-over';relations.forEach(e=>{if(!visSet.has(e.from_id)||!visSet.has(e.to_id))return;const a=nodes.find(n=>n.id===e.from_id),b=nodes.find(n=>n.id===e.to_id);if(!a||!b)return;const A=screen(a),B=screen(b);ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.strokeStyle='rgba(136,194,172,.11)';ctx.lineWidth=Math.max(.6,Math.min(1.7,(Number(e.weight)||1)*.45*zoom));ctx.stroke()});
 vis.forEach(n=>{const p=screen(n),active=selected?.id===n.id,hov=hovered?.id===n.id;ctx.beginPath();ctx.arc(p.x,p.y,p.r+(active?5:hov?3:0),0,Math.PI*2);ctx.fillStyle=active?n.color+'33':hov?n.color+'22':'rgba(255,255,255,.02)';ctx.fill();ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);const g=ctx.createRadialGradient(p.x-p.r*.35,p.y-p.r*.35,1,p.x,p.y,p.r);g.addColorStop(0,n.color);g.addColorStop(.35,n.color+'bb');g.addColorStop(1,n.color+'33');ctx.fillStyle=g;ctx.fill();ctx.strokeStyle=active?'rgba(255,255,255,.72)':n.color+'77';ctx.lineWidth=active?1.6:.8;ctx.stroke();if(zoom>.55||active||hov){ctx.font=`${active?'600':'500'} ${Math.max(9,Math.min(12,10*zoom+2))}px Inter, sans-serif`;ctx.textAlign='center';ctx.textBaseline='top';ctx.fillStyle=active?'#f3faf7':'rgba(220,235,229,.76)';const label=n.title.length>22?n.title.slice(0,21)+'…':n.title;ctx.fillText(label,p.x,p.y+p.r+8)}});ctx.restore()}
canvas.addEventListener('pointerdown',e=>{const rect=canvas.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top,n=nodeAt(x,y);last={x,y};if(n){drag={node:n,ox:(x-pan.x)/zoom-n.x,oy:(y-pan.y)/zoom-n.y};selected=n;openDetail(n)}else drag={node:null,panX:pan.x,panY:pan.y,x,y};canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{const x=e.clientX,y=e.clientY;if(drag){if(drag.node){drag.node.x=(x-pan.x)/zoom-drag.ox;drag.node.y=(y-pan.y)/zoom-drag.oy;drag.node.vx=drag.node.vy=0}else{pan.x=drag.panX+(x-drag.x);pan.y=drag.panY+(y-drag.y)}}else{hovered=nodeAt(x,y);canvas.style.cursor=hovered?'pointer':'grab'}});
canvas.addEventListener('pointerup',e=>{if(drag?.node)savePositions();drag=null;try{canvas.releasePointerCapture(e.pointerId)}catch{}});
canvas.addEventListener('wheel',e=>{e.preventDefault();const old=zoom,f=e.deltaY>0?.9:1.1;zoom=Math.max(.3,Math.min(2.1,zoom*f));const mx=e.clientX,my=e.clientY;pan.x=mx-(mx-pan.x)*(zoom/old);pan.y=my-(my-pan.y)*(zoom/old)},{passive:false});
function openDetail(n){selected=n;const rel=relations.filter(e=>e.from_id===n.id||e.to_id===n.id);const relHtml=rel.map(e=>{const oid=e.from_id===n.id?e.to_id:e.from_id,o=nodes.find(x=>x.id===oid);if(!o)return'';return `<button class="relation" data-id="${o.id}"><span class="rel-dot" style="background:${o.color}"></span><span>${esc(o.title)}</span><span class="rel-type">${esc(e.relation||'related')}</span></button>`}).join('');const visibility=(profile?.contribution_level??0)>=4?`<span class="chip">${esc(n.visibility)}</span>`:'';$('detailBody').innerHTML=`<div class="node-title">${esc(n.title)}</div><div class="chips">${n.domain?`<span class="chip">${esc(n.domain)}</span>`:''}<span class="chip">${esc(n.layer||'')}</span><span class="chip">${esc(n.item_type||'')}</span>${visibility}</div>${n.summary?`<div class="section"><h3>Summary</h3><p>${esc(n.summary)}</p></div>`:''}${n.content?`<div class="section"><h3>Notes</h3><p>${esc(n.content)}</p></div>`:''}${relHtml?`<div class="section"><h3>Connected ideas · ${rel.length}</h3>${relHtml}</div>`:''}`;$('detail').classList.add('open');$('detailBody').querySelectorAll('.relation').forEach(b=>b.addEventListener('click',()=>{const target=nodes.find(x=>x.id===b.dataset.id);if(target){selected=target;openDetail(target);pan.x=W/2-target.x*zoom-180;pan.y=H/2-target.y*zoom}}))}
$('closeDetail').onclick=()=>{$('detail').classList.remove('open');selected=null};
$('search').addEventListener('input',e=>{query=e.target.value.trim();updateMetrics();if(query){const first=visibleNodes()[0];if(first){pan.x=W/2-first.x*zoom;pan.y=H/2-first.y*zoom}}});
$('authBtn').onclick=async()=>{if(session){await supabase.auth.signOut();session=null;profile=null;updateAuthUI();$('detail').classList.remove('open');await loadData()}else{$('authModal').classList.add('open');$('email').focus()}};
$('cancelAuth').onclick=()=>{$('authModal').classList.remove('open');$('authMessage').textContent=''};
$('sendAuth').onclick=async()=>{const email=$('email').value.trim(),m=$('authMessage');m.className='message';m.textContent='';if(!email){m.classList.add('error');m.textContent='メールアドレスを入力してください';return}$('sendAuth').disabled=true;const {error}=await supabase.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname,shouldCreateUser:true}});$('sendAuth').disabled=false;if(error){m.classList.add('error');m.textContent=error.message}else{m.textContent='ログインリンクを送信しました。メールを確認してください。'}};
supabase.auth.onAuthStateChange(async(_event,newSession)=>{session=newSession;await loadProfile();updateAuthUI();await loadData()});
(async()=>{try{await loadSession();await loadData()}catch(err){console.error(err);$('loading').classList.add('hide');$('empty').classList.add('show');$('empty').querySelector('strong').textContent='Knowledge core unavailable';$('empty').querySelector('span').textContent='接続状態を確認してください'}})();draw();
</script>
</body>
</html>
